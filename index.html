<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳动爱心</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            background-color: #000000;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            overflow:hidden;
        }
        canvas{
            max-width:100%;
            height:auto;
        }
    </style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");
// 设置画布大小
const W = 640;
const H = 480;
canvas.width = W;
canvas.height = H;
const cx = W / 2;
const cy = H / 2;
const IMAGE_ENLARGE = 11;

// 工具函数
function heartFunc(t, scale){
    let x = 16 * Math.pow(Math.sin(t),3);
    let y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    x *= scale;
    y *= scale;
    return [x+cx, y+cy];
}
function shrinkPt(x,y){
    let dx = x - cx;
    let dy = y - cy;
    let r2 = dx*dx + dy*dy;
    if(r2 === 0) return [x, y];
    let k = -800 / r2;
    return [x - k*dx, y - k*dy];
}
function scatter(x,y,beta){
    let r1 = -beta * Math.log(Math.random());
    let r2 = -beta * Math.log(Math.random());
    let dx = r1*(x-cx);
    let dy = r2*(y-cy);
    return [x - dx, y - dy];
}

// Heart预计算类
class Heart {
    constructor(frameTotal) {
        this.points = new Set();
        this.edgePoints = new Set();
        this.insidePoints = new Set();
        this.all_points = {};
        this.frameTotal = frameTotal;
        this.build(2000);
        // 预计算每一帧
        for(let f = 0; f < this.frameTotal; f++){
            this.calc(f);
        }
        this.random_halo = 1000;
    }

    build(number) {
        for(let i=0; i<number; i++){
            let t = Math.random() * Math.PI * 2;
            let [x,y] = heartFunc(t, IMAGE_ENLARGE);
            [x,y] = shrinkPt(x, y);
            this.points.add(`${Math.floor(x)},${Math.floor(y)}`);
        }
        // edge points
        for(let s of this.points){
            let [px,py] = s.split(',').map(Number);
            for(let k=0;k<3;k++){
                let [x,y] = scatter(px, py, 0.05);
                this.edgePoints.add(`${x},${y}`);
            }
        }
        // inside points
        let pt_ls = Array.from(this.points).map(s=>{
            let [a,b] = s.split(',');
            return [+a, +b];
        });
        for(let i=0;i<4000;i++){
            let [x,y] = pt_ls[Math.floor(Math.random()*pt_ls.length)];
            [x,y] = scatter(x,y,0.15);
            this.insidePoints.add(`${x},${y}`);
        }
    }

    cal_position(x, y, ratio) {
        let dx = x - cx;
        let dy = y - cy;
        let r2 = dx*dx + dy*dy;
        if(r2 === 0) return [x,y];
        let bt_range = 1 / r2;
        dx = ratio * bt_range * dx + (Math.random()>0.5 ? 1 : -1);
        dy = ratio * bt_range * dy + (Math.random()>0.5 ? 1 : -1);
        return [x - dx, y - dy];
    }

    calc(frame) {
        // 【跳动速度 frame/20 * Math.PI】
        let beatSin = Math.sin(frame / 22 * Math.PI);
        let ratio = 800 * beatSin;
        let haloRadius = 4 + 6*(1+beatSin);
        let haloCount = Math.floor(3000 + 4000 * Math.pow(Math.abs(Math.sin(frame/16*Math.PI)),2));

        let heart_halo_point = new Set();
        let all_pts = [];

        // 光晕粒子
        for(let i=0;i<haloCount;i++){
            let t = Math.random() * Math.PI * 2;
            let [x,y] = heartFunc(t, 11.6);
            [x,y] = shrinkPt(x, y, haloRadius);
            let key = `${Math.floor(x)},${Math.floor(y)}`;
            if(!heart_halo_point.has(key)){
                heart_halo_point.add(key);
                x += Math.floor(Math.random()*28 -14);
                y += Math.floor(Math.random()*28 -14);
                let size = Math.random()>0.5 ? 2:1;
                all_pts.push([x,y,size]);
            }
        }
        // 轮廓点
        for(let s of this.points){
            let [x,y] = s.split(',').map(Number);
            [x,y] = this.cal_position(x,y,ratio);
            let size = Math.floor(Math.random()*3)+1;
            all_pts.push([x,y,size]);
        }
        // 边缘扩散点
        for(let s of this.edgePoints){
            let [x,y] = s.split(',').map(Number);
            [x,y] = this.cal_position(x,y,ratio);
            let size = Math.floor(Math.random()*2)+1;
            all_pts.push([x,y,size]);
        }
        // 内部扩散点
        for(let s of this.insidePoints){
            let [x,y] = s.split(',').map(Number);
            [x,y] = this.cal_position(x,y,ratio);
            let size = Math.floor(Math.random()*2)+1;
            all_pts.push([x,y,size]);
        }
        this.all_points[frame] = all_pts;
    }

    render(ctx, frame) {
        let idx = frame % this.frameTotal;
        let pts = this.all_points[idx];
        ctx.fillStyle = '#ff7171';
        for(let [x,y,sz] of pts){
            ctx.fillRect(x,y,sz,sz);
        }
    }
}

// ========== 文字配置区 ==========
const textContent = "韦丹丹";
const textColor = "#ffdddd";
const baseFontSize = 22;
// =========================================================

// 总帧数改成40，刚好匹配 frame/20 的周期，和原版速度对齐
const heart = new Heart(40);
let frame = 0;

// 动画循环
function animate(){
    ctx.fillStyle="#000000";
    ctx.fillRect(0,0,W,H);
    heart.render(ctx, frame);

    // 文字跳动速度
    let beatSin = Math.sin(frame /20 * Math.PI);
    const scaleText = 1 + beatSin * 0.12;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scaleText, scaleText);
    ctx.fillStyle = textColor;
    ctx.font = `bold ${baseFontSize}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(textContent, 0, 0);
    ctx.restore();

    frame += 1;
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
